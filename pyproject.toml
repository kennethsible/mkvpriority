[project]
name = "mkvpriority"
version = "1.5.2"
description = "Automatically Prioritize Audio/Subtitle Tracks in MKV Files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.14"

keywords = [
    "mkv",
    "mkvtoolnix",
    "mkvpropedit",
    "subtitles",
    "radarr",
    "sonarr",
    "anime",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[dependency-groups]
docker = [
    "aiohttp>=3.14.3",
    "apscheduler>=3.11.3",
    "requests>=2.34.2",
    "pycountry>=26.2.16",
    "cron_descriptor>=2.1.0",
]
dev = [
    "ruff>=0.16.3",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "types-aiofiles",
    "types-requests",
]

[project.urls]
homepage = "https://github.com/kennethsible/mkvpriority"
source = "https://github.com/kennethsible/mkvpriority"
issues = "https://github.com/kennethsible/mkvpriority/issues"
changelog = "https://github.com/kennethsible/mkvpriority/releases"

[project.scripts]
mkvpriority = "mkvpriority.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
ignore_missing_imports = true

[build-system]
requires = ["hatchling>=1.32.0"]
build-backend = "hatchling.build"
