[project]
name = "mkvpriority"
version = "2.2.1"
description = "Automatically Prioritize Audio/Subtitle Tracks in MKV Files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.12"

keywords = [
    "mkv",
    "mkvtoolnix",
    "mkvpropedit",
    "subtitles",
    "radarr",
    "sonarr",
    "anime",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[dependency-groups]
docker = [
    "aiohttp>=3.14.5",
    "apscheduler>=3.11.3",
    "requests>=2.34.2",
    "pycountry>=26.2.16",
    "cron_descriptor>=2.2.1",
]
dev = [
    "ruff>=0.17.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.4.0",
    "types-aiofiles",
    "types-requests",
]

[project.optional-dependencies]
subtitle_converter = ["pysubs2>=1.9.0"]

[project.urls]
homepage = "https://github.com/kennethsible/mkvpriority"
source = "https://github.com/kennethsible/mkvpriority"
issues = "https://github.com/kennethsible/mkvpriority/issues"
changelog = "https://github.com/kennethsible/mkvpriority/releases"

[project.scripts]
mkvpriority = "mkvpriority.main:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
extend-select = ["I"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
strict = true
ignore_missing_imports = true
files = ["src"]

[tool.bandit]
skips = ["B404", "B603", "B607"]
exclude_dirs = [".venv", "tests"]
targets = ["src"]

[build-system]
requires = ["hatchling>=1.32.4"]
build-backend = "hatchling.build"
