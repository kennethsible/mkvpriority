[project]
name = "mkvpriority"
version = "2.4.0"
description = "Automatically Prioritize Audio/Subtitle Tracks in MKV Files"
readme = "README.md"
license = { file = "LICENSE" }
authors = [{ name = "Ken Sible", email = "ksible@outlook.com" }]
requires-python = ">=3.12"

keywords = [
    "mkv",
    "mkvtoolnix",
    "mkvpropedit",
    "subtitles",
    "radarr",
    "sonarr",
    "anime",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Multimedia :: Video",
    "Topic :: Utilities",
]

[dependency-groups]
dev = [
    "ruff>=0.17.5",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-aiohttp>=1.1.1",
    "pytest-asyncio>=1.5.0",
    "types-aiofiles",
    "types-requests",
]

[project.optional-dependencies]
daemon = [
    "aiohttp>=3.14.5",
    "apscheduler>=3.11.3",
    "requests>=2.34.2",
    "pycountry>=26.2.16",
    "cron_descriptor>=2.2.1",
]
subtitle_converter = ["pysubs2>=1.9.1"]

[project.urls]
homepage = "https://github.com/kennethsible/mkvpriority"
source = "https://github.com/kennethsible/mkvpriority"
issues = "https://github.com/kennethsible/mkvpriority/issues"
changelog = "https://github.com/kennethsible/mkvpriority/releases"

[project.scripts]
mkvpriority = "mkvpriority.main:main"
mkvpriority-daemon = "mkvpriority.entrypoint:main"

[tool.ruff]
line-length = 100
src = ["src"]

[tool.ruff.lint]
extend-select = ["I", "S"]

[tool.ruff.lint.per-file-ignores]
"src/**/*.py" = ["S404", "S603", "S607"]
"tests/**/*.py" = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "single"

[tool.mypy]
files = ["src"]
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.hatch.build.targets.wheel.force-include]
"config.toml" = "mkvpriority/config.toml"
"mkvpriority.sh" = "mkvpriority/mkvpriority.sh"

[build-system]
requires = ["hatchling>=1.33.0"]
build-backend = "hatchling.build"
