# === Audio Profiles ===
[audio_profiles]

# === Audio Language Preferences ===
# Example: Prioritize Japanese subs over English dubs.
[audio_profiles.global.languages]
org = 300 # Original Language (Radarr/Sonarr)
jpn = 200 # Japanese
eng = 100 # English
und = 0   # Undefined (Fallback)

# === Audio Codec Preferences ===
# Example: Prioritize audio tracks with higher fidelity.
[audio_profiles.global.codecs]
"A_PCM/INT/LIT" = 50 # LPCM (Linear PCM)
A_DTSHD_MA = 50      # DTS-HD Master Audio
A_TRUEHD = 50        # Dolby TrueHD
A_FLAC = 50          # Free Lossless Audio Codec
A_DTS = 40           # DTS
A_OPUS = 30          # Opus
A_EAC3 = 30          # Dolby Digital Plus (Enhanced AC-3)
A_AC3 = 20           # Dolby Digital (AC-3)
A_AAC = 20           # Advanced Audio Coding
A_VORBIS = 20        # Vorbis
"A_MPEG/L3" = 10     # MP3 (MPEG Layer III)

# === Audio Channel Preferences ===
# Example: Prioritize audio tracks with more channels.
[audio_profiles.global.channels]
8 = 8 # 7.1 Surround
7 = 7 # 6.1 Surround
6 = 6 # 5.1 Surround
5 = 5 # 5.0 Surround
4 = 4 # 4.0 Surround / Quadraphonic
3 = 3 # 2.1 / 3.0 Surround
2 = 2 # Stereo
1 = 1 # Mono

[audio_profiles.default]
# === Audio Profile Mode ===
# Determines the track flag(s) managed by this audio profile:
# - "default"  = Sets best track as default and clears default on other scored tracks
# - "forced"   = Sets best track as forced and clears forced on other scored tracks
# - "disabled" = Sets best track as enabled and disables other scored tracks
# - "enabled"  = Ensures all tracks with a positive score are enabled
# Profiles must specify at least one mode, which must be mutually exclusive.
audio_mode = ["default"]

[audio_profiles.default.filters]
atmos = 5          # Dolby Atmos
commentar = -10000 # Commentary Track
descript = -10000  # Visually Impaired

# === Subtitle Profiles ===
[subtitle_profiles]

# === Penalize Unscored Languages ===
# Determines how subtitle languages without scores are handled:
# - true  = Heavily penalizes unscored languages (score: -10000)
# - false = Assigns a neutral score (0) to unscored languages
# Ensures subtitles in non-native languages are always stripped of flags.
global.penalize_unscored_languages = false

# === Native Audio Languages ===
# Determines when default subtitle flags should be suppressed:
# - list  = Strips default flags if the audio matches these languages
# - empty = Follows profile subtitle modes regardless of the audio
# Ensures full dialogue subtitles are disabled for native audio language.
global.native_languages = ["eng"]

# === Subtitle Language Preferences ===
# Example: Prioritize English subtitles with Japanese audio.
[subtitle_profiles.global.languages]
enm = 101 # English Modified (Anime-Specific)
eng = 100 # English
und = 0   # Undefined (Fallback)

# === Subtitle Codec Preferences ===
# Example: Prioritize subtitle tracks with higher stylability.
[subtitle_profiles.global.codecs]
"S_TEXT/ASS" = 30    # Stylized (Advanced SubStationAlpha)
"S_TEXT/SSA" = 30    # Legacy Stylized (SubStationAlpha)
"S_TEXT/UTF8" = 20   # Plain Text (SubRip/SRT)
"S_TEXT/WEBVTT" = 20 # Web-Based Video Text (Used in Streaming)
"S_HDMV/PGS" = 10    # Image-Based (Used in Blu-rays)
S_VOBSUB = 10        # Legacy Image-Based (Used in DVDs)

[subtitle_profiles.signs_songs]
# === Subtitle Profile Mode ===
# Determines the track flag(s) managed by this subtitle profile:
# - "default"  = Sets best track as default and clears default on other scored tracks
# - "forced"   = Sets best track as forced and clears forced on other scored tracks
# - "disabled" = Sets best track as enabled and disables other scored tracks
# - "enabled"  = Ensures all tracks with a positive score are enabled
# Profiles must specify at least one mode, which must be mutually exclusive.
subtitle_mode = ["forced"]

# === Maximum Size Ratio ===
# Determines the relative size threshold for forced subtitle detection:
# - float = Heavily penalizes tracks exceeding this ratio (score: -10000)
# - unset = Disables size-based filtering for subtitle tracks
# Ensures only forced tracks (signs, songs, etc.) match this profile.
max_size_ratio = 0.15

# === Require Filter Match ===
# Requires at least one filter keyword or size ratio match for this profile:
# - true  = Heavily penalizes tracks with no matching filters (score: -10000)
# - false = Allows tracks to score using global language and codec weights
# Ensures tracks do not match this profile based on language or codec alone.
require_filter_match = true

[subtitle_profiles.signs_songs.filters]
sign = 1           # On-Screen Text
song = 1           # Lyrics / Karaoke
commentar = -10000 # Commentary Track
sdh = -10000       # Deaf / Hard of Hearing

[subtitle_profiles.dialogue]
subtitle_mode = ["default"]

[subtitle_profiles.dialogue.filters]
honorific = 3      # Dialogue + Honorifics
full = 2           # Dialogue + On-Screen Text
dialog = 1         # Spoken Content
sign = -5          # On-Screen Text
song = -5          # Lyrics / Karaoke
commentar = -10000 # Commentary Track
sdh = -10000       # Deaf / Hard of Hearing
