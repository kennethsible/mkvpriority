name: Python CI

on: [push]

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ['3.12', '3.13', '3.14']
    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Package Manager
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Initialize Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}
      - name: Install System Dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg mkvtoolnix
      - name: Install System Dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ffmpeg mkvtoolnix
      - name: Install System Dependencies (Windows)
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg mkvtoolnix -y --no-progress
          echo "C:\Program Files\MKVToolNix" >> $env:GITHUB_PATH
          echo "C:\ProgramData\chocolatey\bin" >> $env:GITHUB_PATH
      - name: Install Python Dependencies
        run: uv sync --all-groups --all-extras
      - name: Run Unit Tests
        run: uv run pytest -s
